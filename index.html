<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d20"><title>Together ❤️</title>
<style>
:root{color-scheme:dark;--bg:#100d20;--card:#1b1730;--pink:#ff6fae;--lav:#b6a0ff;--muted:#bcb6d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38214b 0,var(--bg) 55%);color:#fff;font:16px system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px 48px}.hero{text-align:center;padding:22px 0}.heart{font-size:52px;filter:drop-shadow(0 0 22px #ff6fae88)}h1{font-size:clamp(32px,7vw,48px);margin:4px 0;background:linear-gradient(90deg,#ff94c5,#c5b3ff);color:transparent;background-clip:text}.sub{color:var(--muted)}.card{background:#1b1730eF;border:1px solid #ffffff19;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 16px 50px #0002}h2{margin:0 0 12px;font-size:20px}input,button{font:inherit;border-radius:13px;padding:13px 14px;width:100%;border:1px solid #ffffff24}input{background:#100d20;color:white;margin:6px 0 10px}button{background:linear-gradient(100deg,#ff6fae,#a98aff);border:0;color:#170d24;font-weight:750;cursor:pointer;margin:5px 0}button.secondary{background:#2b2446;color:#fff;border:1px solid #ffffff22}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none!important}.status{color:var(--muted);font-size:14px;min-height:22px;overflow-wrap:anywhere}.code{font-size:20px;letter-spacing:1px;font-weight:800;text-align:center;overflow-wrap:anywhere;color:#ffd0e4}.chat{height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}.msg{background:#302746;border-radius:14px;padding:10px 12px;max-width:90%;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#6e4a85}.tiny{font-size:12px;color:var(--muted)}.actions button{width:31%;font-size:25px;padding:14px 4px}.foot{text-align:center;color:#8f87a9;font-size:12px;padding:20px}@media(max-width:440px){.row{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><main>
<header class="hero"><div class="heart">❤️</div><h1>Together</h1><div class="sub">Ein kleiner Ort nur für euch zwei.</div></header>
<section id="auth" class="card"><h2>Willkommen zurück 💌</h2><div class="row"><button id="tabLogin" class="secondary">Anmelden</button><button id="tabRegister" class="secondary">Konto erstellen</button></div><form id="authForm"><input id="name" placeholder="Dein Name" class="hide"><input id="email" type="email" placeholder="E-Mail" required><input id="password" type="password" placeholder="Passwort (mind. 8 Zeichen)" minlength="8" required><button id="submitAuth">Anmelden</button></form><div id="authStatus" class="status" role="status"></div></section>
<section id="app" class="hide"><section class="card"><h2>Hallo, <span id="userName"></span> ✨</h2><p class="sub">Verbinde eure Konten mit einem einmaligen Couple-Code.</p><div class="row"><button id="createCode">Code erstellen</button><button id="copyCode" class="secondary">Code kopieren</button></div><div id="myCode" class="code"></div><form id="joinForm"><input id="joinCode" placeholder="TOGETHER-XXXXXXXX" autocomplete="off"><button>Code meines Partners verbinden</button></form><div id="pairStatus" class="status"></div></section>
<section class="card"><h2>Euer kleiner Moment 💗</h2><div class="actions row"><button data-pulse="SHARED_LOVE" aria-label="Liebe senden">💗</button><button data-pulse="SHARED_PULSE" aria-label="Puls senden">💓</button><button data-pulse="SHARED_CELEBRATE" aria-label="Feiern">🎉</button></div><div id="realtimeStatus" class="status">Echtzeit wird verbunden …</div><div id="events" class="status"></div></section>
<section class="card"><h2>Euer Chat 💬</h2><div id="chat" class="chat"></div><form id="chatForm"><input id="chatText" placeholder="Schreib etwas Liebes …" maxlength="2000"><button>Nachricht senden</button></form><div id="chatStatus" class="status"></div></section><button id="logout" class="secondary">Abmelden</button></section>
<div class="foot">Together · private couple space</div></main>
<script>
const $=id=>document.getElementById(id);let mode="login",token=localStorage.getItem("together_token")||"",me=null,socket=null,lastChat=new Set();
async function api(path,data,method){const r=await fetch(path,{method:method||(data?"POST":"GET"),headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{})},...(data?{body:JSON.stringify(data)}:{})});const x=await r.json().catch(()=>({error:"Ungültige Serverantwort"}));if(!r.ok)throw Error(x.error||"Anfrage fehlgeschlagen");return x}
function setStatus(id,msg){$(id).textContent=msg}
function authMode(m){mode=m;$("name").classList.toggle("hide",m!=="register");$("name").required=m==="register";$("submitAuth").textContent=m==="register"?"Konto erstellen":"Anmelden";$("tabLogin").classList.toggle("secondary",m!=="login");$("tabRegister").classList.toggle("secondary",m!=="register")}
$("tabLogin").onclick=()=>authMode("login");$("tabRegister").onclick=()=>authMode("register");
$("authForm").onsubmit=async e=>{e.preventDefault();setStatus("authStatus","Einen Moment …");try{const x=await api("/api/"+(mode==="login"?"login":"register"),{name:$("name").value,email:$("email").value,password:$("password").value});token=x.token;localStorage.setItem("together_token",token);me=x.user;showApp()}catch(err){setStatus("authStatus",err.message)}};
function showApp(){$("auth").classList.add("hide");$("app").classList.remove("hide");$("userName").textContent=me.name;setStatus("authStatus","");connect();loadChat()}
async function boot(){if(!token)return;try{const x=await api("/api/me");token=x.token;localStorage.setItem("together_token",token);me=x.user;showApp()}catch{token="";localStorage.removeItem("together_token")}}
function connect(){if(socket)socket.close();const proto=location.protocol==="https:"?"wss:":"ws:";socket=new WebSocket(proto+"//"+location.host+"/ws?token="+encodeURIComponent(token));socket.onopen=()=>setStatus("realtimeStatus","🟢 Echtzeit verbunden");socket.onclose=()=>setStatus("realtimeStatus","Verbindung getrennt – bitte Seite neu laden.");socket.onerror=()=>setStatus("realtimeStatus","Verbindung konnte nicht aufgebaut werden.");socket.onmessage=e=>{let p;try{p=JSON.parse(e.data)}catch{return}if(p.type==="PAIR_CONNECTED"){setStatus("pairStatus",p.name+" ist jetzt mit dir verbunden! ❤️");loadChat()}else if(p.type==="CHAT"){renderMessage(p.message)}else if(["SHARED_PULSE","SHARED_LOVE","SHARED_CELEBRATE"].includes(p.type)){setStatus("events",p.name+" sendet "+({SHARED_LOVE:"Liebe 💗",SHARED_PULSE:"einen Herzschlag 💓",SHARED_CELEBRATE:"eine Feier 🎉"}[p.type]))}}}
$("createCode").onclick=async()=>{try{const x=await api("/api/pair/create",{});$("myCode").textContent=x.code;setStatus("pairStatus","Code erstellt. Teile ihn mit deinem Partner.")}catch(e){setStatus("pairStatus",e.message)}};
$("copyCode").onclick=async()=>{const c=$("myCode").textContent;if(!c)return setStatus("pairStatus","Erstelle zuerst einen Code.");try{await navigator.clipboard.writeText(c);setStatus("pairStatus","Code kopiert!")}catch{setStatus("pairStatus","Code: "+c)}};
$("joinForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/pair/join",{code:$("joinCode").value});setStatus("pairStatus","Verbunden! ❤️");$("joinCode").value="";loadChat()}catch(err){setStatus("pairStatus",err.message)}};
document.querySelectorAll("[data-pulse]").forEach(b=>b.onclick=()=>{if(socket?.readyState===1)socket.send(JSON.stringify({type:b.dataset.pulse}));else setStatus("realtimeStatus","Keine Echtzeitverbindung.")});
function renderMessage(m){if(!m||lastChat.has(m.id))return;lastChat.add(m.id);const d=document.createElement("div");d.className="msg"+(m.from===me.id?" mine":"");const t=document.createElement("div");t.textContent=m.text;const s=document.createElement("div");s.className="tiny";s.textContent=(m.name||"Partner")+" · "+new Date(m.at).toLocaleString();d.append(t,s);$("chat").append(d);$("chat").scrollTop=$("chat").scrollHeight}
async function loadChat(){try{const x=await api("/api/chat/history");$("chat").replaceChildren();lastChat.clear();x.messages.forEach(renderMessage)}catch(e){setStatus("chatStatus","Chat erscheint nach dem Verbinden eurer Konten. "+e.message)}}
$("chatForm").onsubmit=async e=>{e.preventDefault();try{const x=await api("/api/chat/send",{text:$("chatText").value});renderMessage(x.message);$("chatText").value="";setStatus("chatStatus","Gesendet")}catch(err){setStatus("chatStatus",err.message)}};
$("logout").onclick=()=>{if(socket)socket.close();token="";me=null;localStorage.removeItem("together_token");$("app").classList.add("hide");$("auth").classList.remove("hide");authMode("login")};
authMode("login");boot();
</script></body></html>
